name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Migrations run before the app deploys, so they must stay
      # backwards-compatible with the currently live code.
      - name: Run migrations
        run: node scripts/migrate.mjs
        env:
          # Neon's direct (non-pooled) connection string.
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Deploy to Vercel
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
