name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The production build applies db/migrations first (see `vercel-build`
      # in package.json), so migrations must stay backwards-compatible with
      # the currently live code.
      - name: Deploy to Vercel
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
